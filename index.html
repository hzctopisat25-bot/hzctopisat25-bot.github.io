<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows 7 - System Error</title>

<style>
body {
  margin: 0;
  background: #0000AA;
  color: #FFFFFF;
  font-family: "Lucida Console", monospace;
  font-size: 18px;
  padding: 40px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

h1 {
  font-size: 60px;
}

.text {
  font-size: 20px;
  margin-top: 20px;
}

.stop {
  margin-top: 40px;
  font-size: 16px;
}

.percent {
  margin-top: 20px;
  font-size: 18px;
}

.blink {
  animation: blink 1s infinite;
}

@keyframes blink {
  50% { opacity: 0; }
}
</style>
</head>

<body onclick="start()">

<h1>:(</h1>

<div class="text">
  Ваше устройство столкнулось с проблемой и должно быть перезапущено.<br>
  Мы собираем информацию о неисправности и перезапускаем устройство.
</div>

<div class="stop">
  Stop code: CRITICAL_PROCESS_DIED
</div>

<div class="percent" id="percent">0% complete</div>

<script>
let started = false;

function start() {
  if (started) return;
  started = true;

  // Процесс с имитацией звука ошибки
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "square";
  osc.frequency.value = 150;

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  gain.gain.value = 0.3;
  osc.start();
  osc.stop(audioCtx.currentTime + 0.3);

  // Процесс отображения процентов
  let i = 0;
  let percent = document.getElementById("percent");

  let interval = setInterval(() => {
    i += Math.floor(Math.random() * 4) + 1;
    if (i > 100) i = 100;

    percent.innerText = i + "% complete";

    if (i >= 100) {
      clearInterval(interval);
      setTimeout(restart, 1500);
    }
  }, 120);
}

function restart() {
  document.body.innerHTML = `
  <div style="background:black;color:white;height:100vh;
  display:flex;justify-content:center;align-items:center;
  font-size:40px;font-family:sans-serif;">
  Restarting...
  </div>
  `;
  setTimeout(() => location.reload(), 3000);
}
</script>

</body>
</html>
