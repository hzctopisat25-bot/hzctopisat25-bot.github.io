<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Website</title>
<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  text-align:center;
  background:white;
}
#content{
  margin-top:150px;
}
</style>
</head>
<body>

<div id="content">
  <h1>Добро пожаловать 😎</h1>
  <p>Обычный сайт. Ничего подозрительного.</p>
</div>

<script>
let secret = "awesome";
let typed = "";

document.addEventListener("keydown", function(event){
  typed += event.key.toLowerCase();
  if(typed.length > secret.length){
    typed = typed.slice(-secret.length);
  }
  if(typed === secret){
    launch();
  }
});

function playErrorSound(){
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  const osc1 = audioCtx.createOscillator();
  const osc2 = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();

  osc1.type = "sine";
  osc2.type = "sine";

  osc1.frequency.value = 800;
  osc2.frequency.value = 600;

  gainNode.gain.value = 0.2;

  osc1.connect(gainNode);
  osc2.connect(gainNode);
  gainNode.connect(audioCtx.destination);

  osc1.start();
  osc2.start();

  setTimeout(()=>{
    osc1.stop();
    osc2.stop();
  }, 180);
}

function launch(){
  playErrorSound();

  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(()=>{});
  }
  setTimeout(showBSOD, 600);
}

function showBSOD(){
  document.body.innerHTML = `
  <div style="background:#0078D7;color:white;height:100vh;padding:80px;font-family:'Segoe UI',sans-serif;cursor:none;">
    <div style="font-size:120px;">:(</div>
    <div style="font-size:28px;margin-top:20px;">
      Your device ran into a problem and needs to restart.<br>
      We're just collecting some error info, and then we'll restart for you.
    </div>
    <div style="font-size:24px;margin-top:20px;">
      <span id="percent">0%</span> complete
    </div>
    <div style="margin-top:40px;font-size:18px;">
      Stop code: CRITICAL_PROCESS_DIED
    </div>
  </div>
  `;

  let p = 0;
  let interval = setInterval(()=>{
    p++;
    document.getElementById("percent").innerText = p + "%";
    if(p >= 100){
      clearInterval(interval);
      fakeRestart();
    }
  }, 120);
}

function fakeRestart(){
  document.body.innerHTML = `
  <div style="background:black;color:white;height:100vh;display:flex;justify-content:center;align-items:center;font-size:40px;font-family:sans-serif;">
    Restarting...
  </div>
  `;
  setTimeout(()=>{
    if (document.exitFullscreen) {
      document.exitFullscreen().catch(()=>{});
    }
    location.reload();
  }, 3000);
}

document.addEventListener("contextmenu", e => e.preventDefault());
</script>

</body>
</html>
