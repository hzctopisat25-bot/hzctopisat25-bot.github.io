<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SOS · ЗВУК · МОРЗЕ · ФЕДЯ</title>
    <style>
        body {
            background: #0a0a0a;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #111;
            border: 4px solid #00ff00;
            border-radius: 30px;
            padding: 40px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 0 50px #00ff00;
        }
        h1 {
            font-size: 42px;
            letter-spacing: 8px;
            margin-bottom: 10px;
        }
        .morse {
            font-size: 48px;
            font-weight: bold;
            color: #0f0;
            text-shadow: 0 0 20px #0f0;
            margin: 30px 0;
            padding: 20px;
            background: #1a1a1a;
            border-radius: 20px;
        }
        .signal-light {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #0f0;
            margin: 20px auto;
            box-shadow: 0 0 60px #0f0;
            transition: background 0.1s, box-shadow 0.1s;
        }
        .off {
            background: #1a1a1a;
            box-shadow: none;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            margin: 30px 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            background: #222;
            border: 2px solid #0f0;
            color: #0f0;
            font-size: 20px;
            padding: 15px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            transition: 0.1s;
        }
        .btn:hover {
            background: #0f0;
            color: #000;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .log {
            background: #1a1a1a;
            border: 2px solid #0f0;
            border-radius: 15px;
            padding: 15px;
            min-height: 60px;
            font-size: 18px;
            margin-top: 20px;
        }
        .footer {
            margin-top: 30px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🆘 SOS 🆘</h1>
        <div class="morse">··· --- ···</div>
        
        <div class="signal-light off" id="light"></div>
        
        <div class="btn-group">
            <button class="btn" id="startBtn">🚨 ПОДАТЬ СИГНАЛ</button>
            <button class="btn" id="stopBtn">⏹️ СТОП</button>
        </div>
        
        <div class="log" id="log">[ОЖИДАНИЕ]</div>
        
        <div class="footer">
            🧙‍♂️ ФЕДЯ ПИСАТЬ · 713% · R · 🔊 ЗВУК
        </div>
    </div>

    <script>
        const light = document.getElementById('light');
        const log = document.getElementById('log');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');

        // SOS в Морзе: . . .   - - -   . . .
        // точка = 100мс, тире = 300мс, пауза между символами = 100мс, между буквами = 300мс
        const sosPattern = [
            { type: 'dot', duration: 100 },  // S: точка
            { type: 'dot', duration: 100 },  // S: точка
            { type: 'dot', duration: 100 },  // S: точка
            { type: 'pause', duration: 300 }, // пауза между буквами
            { type: 'dash', duration: 300 },  // O: тире
            { type: 'dash', duration: 300 },  // O: тире
            { type: 'dash', duration: 300 },  // O: тире
            { type: 'pause', duration: 300 }, // пауза между буквами
            { type: 'dot', duration: 100 },   // S: точка
            { type: 'dot', duration: 100 },   // S: точка
            { type: 'dot', duration: 100 },   // S: точка
            { type: 'pause', duration: 700 }  // пауза перед повтором
        ];

        let intervalId = null;
        let patternIndex = 0;
        let isRunning = false;
        
        // Аудио контекст
        let audioCtx = null;
        let oscillator = null;
        let gainNode = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                gainNode = audioCtx.createGain();
                gainNode.connect(audioCtx.destination);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime); // Громкость
            }
        }

        function playBeep(duration) {
            if (!audioCtx) return;
            
            oscillator = audioCtx.createOscillator();
            oscillator.type = 'sine'; // чистый тон
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); // частота 800 Гц
            
            oscillator.connect(gainNode);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration / 1000);
        }

        function stopBeep() {
            if (oscillator) {
                oscillator.stop();
                oscillator = null;
            }
        }

        function updateLog(message) {
            log.innerHTML = message;
        }

        function setLightOn() {
            light.classList.remove('off');
        }

        function setLightOff() {
            light.classList.add('off');
        }

        function playStep() {
            if (!isRunning) return;

            const step = sosPattern[patternIndex];
            
            if (step.type === 'dot' || step.type === 'dash') {
                setLightOn();
                playBeep(step.duration);
                updateLog(`🔊 СИГНАЛ: ${step.type === 'dot' ? '· (точка)' : '— (тире)'} · ${step.duration}мс`);
            } else {
                setLightOff();
                stopBeep();
                updateLog(`⏸️ ПАУЗА (${step.duration}мс)`);
            }

            // Переходим к следующему шагу
            patternIndex = (patternIndex + 1) % sosPattern.length;

            // Планируем следующий шаг
            setTimeout(() => {
                if (isRunning) {
                    // Гасим свет перед следующим шагом (если он не пауза)
                    if (sosPattern[patternIndex].type !== 'pause') {
                        setLightOff();
                    }
                    playStep();
                }
            }, step.duration);
        }

        function startSOS() {
            if (isRunning) return;
            
            initAudio();
            // Разблокируем аудио контекст (для мобильных браузеров)
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            isRunning = true;
            patternIndex = 0;
            setLightOff();
            updateLog('🆘 SOS АКТИВИРОВАН · 713% · 🔊 ЗВУК');
            
            // Небольшая задержка перед стартом
            setTimeout(() => {
                if (isRunning) playStep();
            }, 500);
        }

        function stopSOS() {
            isRunning = false;
            setLightOff();
            stopBeep();
            updateLog('⏹️ СИГНАЛ ОСТАНОВЛЕН');
        }

        startBtn.addEventListener('click', startSOS);
        stopBtn.addEventListener('click', stopSOS);
    </script>
</body>
</html>
