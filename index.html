<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Website</title>
<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  text-align:center;
  background:white;
}
#content{
  margin-top:150px;
}
input{
  opacity:0;
  position:absolute;
}
</style>
</head>
<body onclick="focusInput()">

<div id="content">
  <h1>Добро пожаловать 😎</h1>
  <p>Обычный сайт. Ничего подозрительного.</p>
</div>

<input id="hiddenInput" autocomplete="off">

<script>
let secret = "awesome";

function focusInput(){
  document.getElementById("hiddenInput").focus();
}

document.getElementById("hiddenInput").addEventListener("input", function(e){
  if(this.value.toLowerCase().includes(secret)){
    launch();
    this.value="";
  }
});

function playErrorSound(){
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "sine";
  osc.frequency.value = 700;
  gain.gain.value = 0.25;

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  setTimeout(()=>osc.stop(), 200);
}

function launch(){
  playErrorSound();
  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(()=>{});
  }
  setTimeout(showBSOD, 600);
}

function showBSOD(){
  document.body.innerHTML = `
  <div style="background:#0078D7;color:white;height:100vh;padding:60px;font-family:'Segoe UI',sans-serif;cursor:none;">
    <div style="font-size:80px;">:(</div>
    <div style="font-size:20px;margin-top:20px;">
      Your device ran into a problem and needs to restart.
    </div>
    <div style="font-size:18px;margin-top:20px;">
      <span id="percent">0%</span> complete
    </div>
  </div>
  `;

  let p = 0;
  let interval = setInterval(()=>{
    p++;
    document.getElementById("percent").innerText = p + "%";
    if(p >= 100){
      clearInterval(interval);
      fakeRestart();
    }
  }, 100);
}

function fakeRestart(){
  document.body.innerHTML = `
  <div style="background:black;color:white;height:100vh;display:flex;justify-content:center;align-items:center;font-size:30px;">
    Restarting...
  </div>
  `;
  setTimeout(()=>{
    location.reload();
  }, 2500);
}
</script>

</body>
</html>
